title: "Saptarshi Halder"
description: "Notes, essays, and stories."
author: "Saptarshi Halder"
url: "https://saptarshihalder.github.io"
baseurl: "/blog"
lang: "en"
timezone: "Asia/Kolkata"

markdown: kramdown
permalink: pretty

# Keep build/runtime files out of Jekyll's content scanner.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .github
  - node_modules
  - package.json
  - package-lock.json
  - assets/src
