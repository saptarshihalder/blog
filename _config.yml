title: "Saptarshi Halder"
description: "Notes, essays, and stories."
author: "Saptarshi Halder"
url: "https://saptarshihalder.github.io"
baseurl: "/blog"
lang: "en"
timezone: "Asia/Kolkata"

markdown: kramdown
permalink: pretty

# Keep build/runtime files out of Jekyll's content scanner. ruby/setup-ruby
# installs cached gems under vendor/bundle, which contains Jekyll's own sample
# posts and templates; those must never be treated as pages in this site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .github
