<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10120f">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/mobile.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/ambient.css' | relative_url }}">
</head>
<body class="{% if page.layout == 'post' %}is-post{% else %}is-page{% endif %}">
  <canvas class="ambient-field" id="ambient-field" aria-hidden="true"></canvas>
  <div class="ambient-haze" aria-hidden="true"></div>
  <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>

  {% include site-header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include site-footer.html %}
  <script src="{{ '/assets/js/ambient-bg.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.writing_index %}<script src="{{ '/assets/js/writing-index.bundle.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
